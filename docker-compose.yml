services:
  backend:
    container_name: Ginku_backen
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PORT=3000
      - APIKEY=${APIKEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - WEB_PUSH_STORE_PATH=/app/data/web-push-subscriptions.json
      - WEB_PUSH_ORIGINS=${WEB_PUSH_ORIGINS:-https://ginku.diogo-andrade.org}
    volumes:
      - web_push_data:/app/data
    networks: [ginku, caddy_net]
    expose:
      - '3000'
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/health']
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    container_name: Ginku_front
    build:
      context: .
      dockerfile: front/Dockerfile
    networks: [ginku, caddy_net]
    expose:
      - '5173'
    restart: always
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:5173/']
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  web_push_data:

networks:
  ginku:
    driver: bridge
  caddy_net:
    external: true
