version: 2

updates:
  - package-ecosystem: 'docker'
    directories:
      - '/backend'
      - '/front'
      - '/MCP'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
      timezone: 'Europe/Paris'
    groups:
      docker-minor-and-patch:
        update-types:
          - 'minor'
          - 'patch'
    open-pull-requests-limit: 5
